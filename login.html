<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in to Sentinel</title>
<meta name="description" content="Sign in to Sentinel to manage your scam protection, reports and trusted sites.">
<link rel="icon" href="assets/img/sentinel.png" type="image/png">
<link rel="stylesheet" href="assets/css/sentinel.css">
<link rel="stylesheet" href="assets/css/pages.css">
</head>
<body>

<main class="auth-page">
  <div class="auth-card">
    <div class="center" style="margin-bottom:26px">
      <a class="brand" href="index.html" style="justify-content:center">
        <img class="logo-image" src="assets/img/sentinel.png" width="40" height="40" alt="">
        <span class="brand__name">Sentinel</span>
      </a>
    </div>

    <div class="card">
      <h1 style="font-size:1.55rem;margin-bottom:6px">Welcome back</h1>
      <p class="muted small" style="margin-bottom:24px">Sign in to keep your protection running.</p>

      <div id="note" class="form-note" role="status">Accounts are coming soon. Sign-up and sign-in are not available yet.</div>

      <button class="btn btn--block btn--google" id="google" type="button" disabled>
        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#4285F4" d="M45.1 24.5c0-1.6-.1-2.8-.4-4H24v7.3h12.1c-.2 2-1.6 5-4.5 7l6.9 5.3c4.1-3.8 6.6-9.4 6.6-15.6Z"/>
          <path fill="#34A853" d="M24 46c5.9 0 10.9-2 14.5-5.3l-6.9-5.3c-1.9 1.3-4.4 2.2-7.6 2.2-5.8 0-10.7-3.8-12.5-9.1l-7.1 5.5C8.1 41.1 15.5 46 24 46Z"/>
          <path fill="#FBBC05" d="M11.5 28.5c-.5-1.3-.7-2.8-.7-4.5s.3-3.2.7-4.5l-7.1-5.5C2.9 17 2 20.4 2 24s.9 7 2.4 10l7.1-5.5Z"/>
          <path fill="#EA4335" d="M24 10.6c4.1 0 6.9 1.8 8.5 3.3l6.2-6C34.9 4.4 29.9 2 24 2 15.5 2 8.1 6.9 4.4 14l7.1 5.5c1.8-5.3 6.7-8.9 12.5-8.9Z"/>
        </svg>
        Continue with Google
      </button>

      <div class="or">or</div>

      <form id="form"><fieldset id="authFields" disabled>
        <div class="field">
          <label for="email">Email</label>
          <input aria-describedby="error-email" id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
          <span class="error" id="error-email" data-error="email"></span>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input aria-describedby="error-password" id="password" name="password" type="password" autocomplete="current-password" placeholder="Your password" required>
          <span class="error" id="error-password" data-error="password"></span>
        </div>

        <button class="btn btn--block btn--gold" type="submit" id="submit" style="margin-top:6px">Sign in</button>
      </fieldset></form>
    </div>

    <p class="auth-switch">New to Sentinel? <a href="signup.html">Create an account</a></p>
  </div>
</main>

<script src="assets/js/config.js"></script>
<script src="assets/js/masks.js"></script>
<script src="assets/js/sentinel.js"></script>
<script src="assets/js/auth.js"></script>
<script>Auth.init('login');</script>
</body>
</html>
